<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Privacy Policy</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(100%, 680px);
      }

      h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.1;
        margin: 0 0 16px;
      }

      p {
        font-size: 1.125rem;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Privacy Policy</h1>
      <p>No data is being collected or transmitted.</p>
    </main>
  </body>
</html>
